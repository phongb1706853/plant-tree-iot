# Deploy stack cho máy Mac — CHỈ CẦN FILE NÀY, không cần source code.
# Image server + MCP được pull sẵn từ GHCR; MongoDB chạy kèm trong stack.
#
#   docker compose -f docker-compose.deploy.yml up -d      # chạy (tự pull image)
#   docker compose -f docker-compose.deploy.yml pull       # lấy bản mới nhất
#   docker compose -f docker-compose.deploy.yml down        # dừng
#
# Truy cập API:  http://localhost:8080
# MCP (cho AI server):  http://localhost:8100/mcp
name: planttree-iot

services:
  server:
    image: ghcr.io/phongb1706853/plant-tree-iot:latest
    pull_policy: always
    ports:
      - "8080:8000" # host 8080 -> container 8000 (app nghe cổng 8000)
    environment:
      PORT: "8000"
      ASPNETCORE_ENVIRONMENT: Production
      # JWT: BẮT BUỘC ở Production. Đặt trong .env cùng thư mục:
      #   JWT_SECRET=$(openssl rand -base64 48)
      # Thiếu -> compose báo lỗi ngay (fail-closed), server cũng không khởi động.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - set it in .env}"
      # Kết nối tới service mongodb trong cùng network (KHÔNG dùng localhost)
      MONGO_URL: mongodb://mongodb:27017
      # HiveMQ Cloud — override bằng .env cùng thư mục nếu cần
      MQTT_BROKER: ${MQTT_BROKER:-ba4fbc53bce842ffb0fcd51178d78414.s1.eu.hivemq.cloud}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USERNAME: ${MQTT_USERNAME:-nod-iot-plant}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-Nod-iot-plant1234}
      MQTT_USE_TLS: ${MQTT_USE_TLS:-true}
      # Bỏ qua xác thực cert (trust store macOS thiếu CA của HiveMQ) — chỉ dùng dev
      MQTT_ALLOW_INVALID_CERT: ${MQTT_ALLOW_INVALID_CERT:-true}
      # AI server (tree-grow-helper) cho /api/assistant/*. Chạy NGOÀI stack này (trên host).
      # Mac/Windows Docker Desktop: host.docker.internal trỏ về host (extra_hosts bên dưới cho Linux).
      AI_SERVER_URL: ${AI_SERVER_URL:-http://host.docker.internal:8787}
      # Notify service (team thông báo) — container 'notification' ở stack RIÊNG trên cùng máy Mac.
      # Container Notify nghe 3001 NHƯNG publish ra host là 3002 (3002:3001). Stack này khác mạng
      # Docker nên đi qua host: host.docker.internal:3002 -> forward vào notification:3001.
      # KHÔNG kèm /internal/notify (code tự thêm). NOTIFY_API_KEY để trong .env; thiếu key -> tắt.
      NOTIFY_URL: ${NOTIFY_URL:-http://host.docker.internal:3002}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY:-}
      NOTIFY_OFFLINE_SECONDS: ${NOTIFY_OFFLINE_SECONDS:-240}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
    restart: unless-stopped

  mcp:
    image: ghcr.io/phongb1706853/plant-tree-iot:mcp
    pull_policy: always
    ports:
      - "8100:8100" # AI server (stack tree-grow-helper) gọi http://host.docker.internal:8100/mcp
    environment:
      # Gọi ngược .NET trong cùng network (container port 8000, KHÔNG phải 8080)
      PLANT_API_URL: http://server:8000
      # Service-account MCP — tạo trước bằng POST /api/auth/register, mật khẩu đặt trong .env.
      # Thiếu mật khẩu -> MCP vẫn chạy nhưng tool nào cũng lỗi 401 khi gọi .NET.
      PLANT_MCP_EMAIL: ${PLANT_MCP_EMAIL:-mcp@plant-tree.local}
      PLANT_MCP_PASSWORD: ${PLANT_MCP_PASSWORD:-}
    depends_on:
      - server
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    volumes:
      - mongodb_data:/data/db # dữ liệu giữ lại giữa các lần chạy
    restart: unless-stopped

volumes:
  mongodb_data:
